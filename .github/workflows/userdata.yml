name: iPadOS 27 userdata

# Build the iPadOS 27 root image and its signed-policy hash tables on the runner.
# The root image is device-independent and this job uses no repository secrets.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner architecture"
        type: choice
        options: ["macos-26", "macos-26-intel"]
        default: "macos-26"

permissions:
  contents: read

concurrency:
  group: userdata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  userdata:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 2366e33e4934696424bb9f5aa7598df925fbc0c1
          path: UniXNU
      - name: tools
        run: |
          # The release assets of blacktop/ipsw answered 504 for hours on 2026-11-08, so the formula
          # install can fail; build the same tag from source then.
          if ! brew install blacktop/tap/ipsw; then
            brew install go
            GOBIN="$HOME/.local/bin" go install github.com/blacktop/ipsw/cmd/ipsw@v3.1.743
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          command -v ipsw
          ipsw version || true
      - name: free space
        run: df -h /System/Volumes/Data
      - name: userdata root image
        working-directory: UniXNU
        run: |
          python3 ./unixnu build userdata --device ../device --os 27
          df -h /System/Volumes/Data
      - name: root policy tables
        # The boot image carries only the 544-byte signed VerifiedRoot headers
        # (scripts/policies/<profile>/<window>/manifest.header.bin, CONFIG_XNU_SOURCE_STORAGE_TABLES="userdata").
        # NativeUfs reads each hash table from the root image object "<window>.vroot"; without it, root step 3
        # fails with "root window preparation failed". The table is the SHA-256 of every 4096-byte block of
        # the window (VerifiedRoot tools/manifest.py), so it is rebuilt here and checked against the signed header.
        run: |
          python3 - <<'PY2'
          import hashlib, json, pathlib, struct, sys
          report_path = next(pathlib.Path('UniXNU/out/sheng').glob('*/*/userdata/userdata-root.json'))
          profile = report_path.parts[3]
          policies = pathlib.Path('device/scripts/policies') / profile
          if not policies.is_dir():
              sys.exit(f'no signed root policies for {profile} under {policies}')
          report = json.loads(report_path.read_text())
          image = report_path.with_suffix('.img')
          out = pathlib.Path('vroot'); out.mkdir()
          with image.open('rb') as handle:
              for window in report['windows']:
                  name = window['name']
                  header = (policies / name / 'manifest.header.bin').read_bytes()
                  record = json.loads((policies / name / 'verification.json').read_text())
                  magic, _, _, block, _, image_bytes, count = struct.unpack_from('<8s4I2Q', header)
                  table_digest = header[88:120]
                  print(f'{name}: window {window["size"]} bytes sha256 {window["sha256"]}')
                  print(f'{name}: policy {image_bytes} bytes sha256 {record["image_sha256"]} blocks {count}')
                  if magic != b'VROOT01\0' or block != 4096 or len(header) != 544:
                      sys.exit(f'{name}: unexpected policy header')
                  if window['size'] != image_bytes or window['sha256'] != record['image_sha256'] or header[56:88].hex() != window['sha256']:
                      sys.exit(f'{name}: the IPSW disk image differs from the signed policy (size or SHA-256)')
                  table = bytearray()
                  handle.seek(window['offset'])
                  remaining = image_bytes
                  while remaining:
                      data = handle.read(min(4096, remaining))
                      if not data:
                          sys.exit(f'{name}: short read')
                      table += hashlib.sha256(data).digest()
                      remaining -= len(data)
                  if len(table) != count * 32 or hashlib.sha256(table).digest() != table_digest:
                      sys.exit(f'{name}: rebuilt hash table does not match the signed header')
                  (out / f'{name}.vroot').write_bytes(table)
                  print(f'{name}.vroot: {len(table)} bytes, sha256 {hashlib.sha256(table).hexdigest()} (matches signed header)')
          (out / 'pass1.json').write_text(json.dumps(report['windows']))
          PY2
      - name: userdata root image with policy tables
        working-directory: UniXNU
        run: |
          objects=()
          for t in ../vroot/*.vroot; do objects+=(--object "$(basename "$t")=$t"); done
          python3 ./unixnu build userdata --device ../device --os 27 "${objects[@]}"
      - name: Verify final userdata layout
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report_path = Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/userdata/userdata-root.json')
          report = json.loads(report_path.read_text())
          image = report_path.with_suffix('.img')
          previous = json.loads(Path('vroot/pass1.json').read_text())
          if report['windows'] != previous:
              raise SystemExit('OS windows changed when packaging verified-root tables')
          if [obj['name'] for obj in report['objects']] != ['OS.vroot', 'SystemOS.vroot']:
              raise SystemExit('Expected exactly the OS and SystemOS verified-root tables')
          for obj in report['objects']:
              data = (Path('vroot') / obj['name']).read_bytes()
              if obj['size'] != len(data) or obj['sha256'] != hashlib.sha256(data).hexdigest():
                  raise SystemExit(f"Packed table differs from the verified table: {obj['name']}")
          if report['image_bytes'] != 15_753_805_824 or image.stat().st_size != report['image_bytes']:
              raise SystemExit('Final userdata size differs from the pinned 24A446 layout')
          print(f"Verified userdata layout and tables, SHA-256 {report['image_sha256']}")
          PY
      - name: root volume
        uses: actions/upload-artifact@v4
        with:
          name: userdata-root-27
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img
            UniXNU/out/sheng/*/*/userdata/userdata-root.json
