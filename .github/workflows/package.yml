name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      runner:
        description: "macOS runner architecture"
        type: choice
        options: ["macos-26", "macos-26-intel"]
        default: "macos-26"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Stage checksum-verified IPSW utility
        run: |
          version=3.1.742
          cpu="$(uname -m)"
          case "$cpu" in
            arm64) digest=0c9c1681830d93b8abc9f7dddd574872b40ddb297695900cb7e4bb96a68bf5f3 ;;
            x86_64) digest=a04adb1e2d619a461042251d04ea2fccb009206d248f64c7da5d56964d8704d0 ;;
            *) echo "Unsupported runner architecture: $cpu" >&2; exit 1 ;;
          esac
          tool_dir="$RUNNER_TEMP/unixnu-ipsw"
          mkdir -p "$tool_dir"
          archive="ipsw_${version}_macOS_${cpu}.tar.gz"
          if curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            "https://github.com/blacktop/ipsw/releases/download/v$version/$archive" -o "$tool_dir/$archive"; then
            printf '%s  %s\n' "$digest" "$tool_dir/$archive" | shasum -a 256 -c -
            tar -xzf "$tool_dir/$archive" -C "$tool_dir" ipsw
            rm "$tool_dir/$archive"
          else
            command -v go >/dev/null || brew install go
            GOBIN="$tool_dir" go install "github.com/blacktop/ipsw/cmd/ipsw@v$version"
          fi
          "$tool_dir/ipsw" version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup
          llvm_bin="$(brew --prefix llvm)/bin"
          lld_bin="$(brew --prefix lld)/bin"
          bison_bin="$(brew --prefix bison)/bin"
          rustup_bin="$(brew --prefix rustup)/bin"
          printf '%s\n' "$llvm_bin" "$lld_bin" "$bison_bin" "$rustup_bin" >> "$GITHUB_PATH"
          export PATH="$rustup_bin:$llvm_bin:$lld_bin:$bison_bin:$PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          cargo +1.98.0 --version
          command -v unifdef >/dev/null || brew install unifdef
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find mig
          # Check the tools before downloading firmware and compiling.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw ld.lld lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy unifdef; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 2366e33e4934696424bb9f5aa7598df925fbc0c1
          path: UniXNU
          submodules: recursive
      - name: Check out pinned Sheng firmware sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 66421cb7bb5694843aec8de1ca3d1de4c20cca38
          path: uefi-sheng
          # The firmware build initializes board.toml submodules and stages verified vendor inputs.
      - uses: actions/checkout@v4
        if: inputs.os == '27'
        with:
          repository: UniXNU/UniXNU-sm8550-common
          ref: 2dc650ca76ae38715cd0712e60a44b14fe251745
          path: sm8550
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.os == '27'
        with:
          repository: ks114514/UniXNU-sheng
          ref: 6f4792fe416ea88ce0aab1bcd480b430f4807165
          path: wifi-inputs
          sparse-checkout: firmware/wcn7850
          persist-credentials: false
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: Verify WCN7850 firmware against the board manifest
        if: inputs.os == '27'
        working-directory: device
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path

          destination = Path('firmware/wcn7850')
          source = Path('../wifi-inputs/firmware/wcn7850')
          manifest = json.loads((destination / 'manifest.json').read_text())['files']
          for name, expected in manifest.items():
              data = (source / name).read_bytes()
              if len(data) != expected['bytes'] or hashlib.sha256(data).hexdigest() != expected['sha256']:
                  raise SystemExit(f'WCN7850 firmware differs from the board manifest: {name}')
              (destination / name).write_bytes(data)
          PYTHON
      - name: Prepare pinned Ath12k sources
        if: inputs.os == '27'
        working-directory: device/drivers/Ath12kWifi
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import subprocess

          lock = json.loads(Path('tools/source-lock.json').read_text())
          Path('deps').mkdir(exist_ok=True)
          for name in ('linux', 'freebsd'):
              source = lock[name]
              directory = Path('deps') / name
              subprocess.run(['git', 'clone', '--depth', '1', '--branch', source['ref'],
                              '--filter=blob:none', '--sparse', source['url'], str(directory)], check=True)
              subprocess.run(['git', '-C', str(directory), 'sparse-checkout', 'set', '--no-cone',
                              '/.unixnu-placeholder'], check=True)
          PYTHON
          python3 tools/fetch-sources.py
      - name: Extract pinned keyboard and video firmware
        if: inputs.os == '27'
        working-directory: device
        run: |
          python3 scripts/extract-files.py --section Keyboard
          python3 scripts/extract-files.py --section Video
      - name: Allow time for the hosted Metal bridge build
        if: inputs.os == '27'
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('scripts/build-adreno-metal-bridge.py')
          source = script.read_text()
          old = 'stderr=subprocess.STDOUT, timeout=1800)'
          if source.count(old) != 1:
              raise SystemExit('Unexpected timeout in pinned Metal bridge builder')
          script.write_text(source.replace(old, 'stderr=subprocess.STDOUT, timeout=7200)'))
          PY
      - name: Apply iPadOS 27 kernel link fixes
        if: inputs.os == '27'
        run: |
          git apply --check device/.github/patches/ipados-27-final-link.patch
          git apply device/.github/patches/ipados-27-final-link.patch
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ]; then
            args+=(--local-module soc:sm8550=../sm8550)
            if [ "$INIT_DATA" = true ]; then
              args+=(--init-data)
            fi
          fi
          scripts/package.sh "${args[@]}"
      - name: Show Metal bridge compiler output on failure
        if: failure() && inputs.os == '27'
        run: |
          log=UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/tree/build/adreno-metal-bridge/build-ios27.log
          if [ -f "$log" ]; then tail -60 "$log"; fi
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
